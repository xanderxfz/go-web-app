{{define "content"}}
<div class="relative overflow-hidden">
    <!-- Hero Section -->
    <div class="flex flex-col items-center justify-center min-h-[85vh] px-4 sm:px-6 lg:px-8">
        <div class="relative mb-12 group cursor-pointer" x-data="{ hovered: false }" @mouseenter="hovered = true" @mouseleave="hovered = false">
            <div class="absolute -inset-8 rounded-full blur-3xl transition-all duration-700" :class="($store.theme.dark ? 'bg-white/5' : 'bg-black/5') + (hovered ? ($store.theme.dark ? ' bg-white/10 scale-110' : ' bg-black/10 scale-110') : '')"></div>
            <svg class="relative h-48 w-48 sm:h-64 sm:w-64 lg:h-80 lg:w-80 transition-transform duration-500" :class="($store.theme.dark ? 'text-white' : 'text-black') + (hovered ? ' scale-105' : '')" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 8C48 8 42 14 42 20V36C42 36 30 36 24 42C18 48 18 56 24 62L30 68L24 92C22 100 28 108 36 108H84C92 108 98 100 96 92L90 68L96 62C102 56 102 48 96 42C90 36 78 36 78 36V20C78 14 72 8 60 8Z" fill="currentColor"/>
                <line x1="42" y1="46" x2="54" y2="58" stroke="black" stroke-width="6" stroke-linecap="round"/>
                <line x1="54" y1="46" x2="42" y2="58" stroke="black" stroke-width="6" stroke-linecap="round"/>
                <line x1="66" y1="46" x2="78" y2="58" stroke="black" stroke-width="6" stroke-linecap="round"/>
                <line x1="78" y1="46" x2="66" y2="58" stroke="black" stroke-width="6" stroke-linecap="round"/>
                <path d="M48 74L60 68L72 74" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="42" y="92" width="8" height="12" rx="2" fill="black"/>
                <rect x="52" y="92" width="8" height="12" rx="2" fill="black"/>
                <rect x="62" y="92" width="8" height="12" rx="2" fill="black"/>
            </svg>
        </div>

        <div class="text-center max-w-3xl">
            <h1 class="text-4xl sm:text-5xl lg:text-7xl font-bold tracking-tight mb-6">
                <span class="bg-gradient-to-r" :class="$store.theme.dark ? 'from-white via-white/90 to-white/60' : 'from-black via-black/90 to-black/60'" style="background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    DEADDOG
                </span>
            </h1>
            <p class="text-lg sm:text-xl max-w-xl mx-auto mb-10 leading-relaxed" :class="$store.theme.dark ? 'text-white/60' : 'text-black/60'">
                Built with Go. Styled with Tailwind. Designed for the dark side.
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/about" class="inline-flex items-center px-8 py-3.5 rounded-lg font-semibold text-sm transition-all duration-200" :class="$store.theme.dark ? 'bg-white text-black hover:bg-white/90 hover:shadow-lg hover:shadow-white/10' : 'bg-black text-white hover:bg-black/90 hover:shadow-lg hover:shadow-black/10'">
                    Explore
                    <svg class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </a>
                <a href="/health" class="inline-flex items-center px-8 py-3.5 rounded-lg border font-semibold text-sm transition-all duration-200" :class="$store.theme.dark ? 'border-white/20 text-white hover:bg-white/5' : 'border-black/20 text-black hover:bg-black/5'">
                    Health Check
                </a>
            </div>
        </div>
    </div>

    <!-- Features Grid -->
    <div class="border-t transition-colors duration-300" :class="$store.theme.dark ? 'border-white/10' : 'border-black/10'">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-24">
            <div class="text-center mb-16">
                <h2 class="text-2xl sm:text-3xl font-bold">Production Ready</h2>
                <p class="mt-3" :class="$store.theme.dark ? 'text-white/50' : 'text-black/50'">Everything you need to ship fast</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" x-data="{ activeCard: null }">
                <template x-for="(card, i) in features" :key="i">
                    <div class="group rounded-xl border p-6 transition-all duration-300 cursor-pointer"
                         :class="(activeCard === i ? ($store.theme.dark ? 'bg-white/[0.06] border-white/30' : 'bg-black/[0.06] border-black/30') : ($store.theme.dark ? 'border-white/10 bg-white/[0.02] hover:bg-white/[0.04] hover:border-white/20' : 'border-black/10 bg-black/[0.02] hover:bg-black/[0.04] hover:border-black/20'))"
                         @click="activeCard = activeCard === i ? null : i">
                        <div class="mb-4 inline-flex items-center justify-center rounded-lg p-3" :class="$store.theme.dark ? 'bg-white/10' : 'bg-black/10'">
                            <svg class="h-5 w-5" :class="$store.theme.dark ? 'text-white' : 'text-black'" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="card.icon"/>
                            </svg>
                        </div>
                        <h3 class="text-lg font-semibold mb-2" x-text="card.title"></h3>
                        <p class="text-sm leading-relaxed" :class="$store.theme.dark ? 'text-white/50' : 'text-black/50'" x-text="card.desc"></p>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('app', () => ({
        features: [
            { title: 'Go Backend', desc: 'High-performance HTTP server with middleware chain, graceful shutdown, and structured logging.', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
            { title: 'Tailwind Dark Mode', desc: 'Utility-first CSS with automatic dark mode, custom theme variables, and optimized build.', icon: 'M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01' },
            { title: 'Security Headers', desc: 'CSP, XSS protection, frame denial, and request ID tracking out of the box.', icon: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z' },
            { title: 'Structured Logging', desc: 'JSON structured logs with slog, request tracing, and panic recovery.', icon: 'M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4' },
            { title: 'Graceful Shutdown', desc: 'Signal handling with clean connection draining and configurable timeouts.', icon: 'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15' },
            { title: 'Go Templates', desc: "Server-side rendering with Go's html/template, partials, and custom functions.", icon: 'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4' },
        ]
    }));
});
</script>
{{end}}
