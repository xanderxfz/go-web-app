                    <line x1="66" y1="46" x2="78" y2="58" stroke="black" stroke-width="6" stroke-linecap="round"/>

            <p class="text-sm" :class="$store.theme.dark ? 'text-white/40' : 'text-black/40'">&copy; {{.Year}} DEADDOG. All rights reserved.</p>
        </div>
    </div>
</footer>
{{end}}
