version: '3'

vars:
  APP_NAME: go-web-app
  MAIN: ./cmd/server

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  css:
    desc: Build TailwindCSS
    cmds:
      - bun run build:css

  dev:
    desc: Run in development mode
    deps: [css]
    cmds:
      - go run {{.MAIN}}

  build:
    desc: Build for production
    deps: [css]
    cmds:
      - CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/{{.APP_NAME}} {{.MAIN}}

  run:
    desc: Build and run
    deps: [build]
    cmds:
      - ./bin/{{.APP_NAME}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ static/css/output.css node_modules
